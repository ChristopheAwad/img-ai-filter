[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "img-ai-filter"
version = "0.2.4"
description = "Privacy-conscious desktop review tool for screenshots and memes"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "certifi>=2024.8.30,<2027",
    "keyring>=25.7.0,<26",
    "packaging>=26.3,<27",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]
eval = []

[tool.hatch.build.targets.wheel]
packages = ["src/img_ai_filter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
