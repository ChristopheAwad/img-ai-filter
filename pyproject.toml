[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "img-ai-filter"
version = "0.1.0"
description = "Offline desktop review tool for screenshots and memes"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/img_ai_filter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
