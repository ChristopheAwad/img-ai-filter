name: Linux package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install application, tests, and pinned packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' -r packaging/linux/requirements.txt -c packaging/linux/runtime-constraints.txt
      - name: Run network-blocked test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Download and verify AppImage tools
        run: |
          curl --fail --location --output appimagetool 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          printf '%s  %s\n' 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' appimagetool | sha256sum --check
          curl --fail --location --output appimage-runtime 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64'
          printf '%s  %s\n' '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d' appimage-runtime | sha256sum --check
          chmod +x appimagetool
      - name: Build artifacts
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python tools/build_linux.py --appimagetool ./appimagetool --runtime ./appimage-runtime
      - name: Smoke test tar payload
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          tar -xzf packaging-build/ImageFilter-*-linux-x86_64.tar.gz -C "$temporary"
          XDG_CONFIG_HOME="$temporary/config" XDG_CACHE_HOME="$temporary/cache" XDG_DATA_HOME="$temporary/data" "$temporary"/ImageFilter-*-linux-x86_64/image-filter --smoke-test
      - name: Verify artifact checksums
        working-directory: packaging-build
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ImageFilter-linux-x86_64
          path: |
            packaging-build/*.AppImage
            packaging-build/*.tar.gz
            packaging-build/SHA256SUMS
          if-no-files-found: error
